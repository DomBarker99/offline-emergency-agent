<!doctype html>
<!--
  The app's screen. Served by src/server.ts at /companion and shown in the desktop window (app/main.ts).

  What's on it:
    - launch alert      a full-window alert when the app opens ("Flooding is occurring"), dismissed with "Got it"
    - alert card        the active emergency: Live/Offline chip, title, readings, the animated window
    - assistant         the whole conversation, "Help me now" prompts, microphone, message box
    - support contact   read-only from data/profile.json, with a Call button (911 is text only, never a link)
    - official guidance the scenario's action card: verbatim official steps, works without any model
    - banner            appears when the internet drops ("No internet...") and when it comes back

  Where data comes from (all on 127.0.0.1, so it works offline):
    GET  /api/setup    once: scenario, contact, card, prompts
    GET  /api/status   every second: is there internet (the server probes it), is the local model loaded
    GET  /api/feed     every 10 seconds while online: the latest emergency packet (503 while offline)
    POST /api/chat     a question -> {answer, provider, fallback}
    POST /api/transcribe  a recording -> {text}

  Offline = no network interface (navigator.onLine, instant) OR the server's probe can't reach the
  internet OR "simulate offline" (Ctrl+Shift+O, the hidden presenter key). Any one is enough.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Emergency Agent</title>
<style>
/* ---- Base ------------------------------------------------------------------------------------- */
:root {
  --bg: #f6f5f0; --panel: #fffefa; --line: #e3e4da; --text: #27353a; --muted: #66727a;
  --green: #4f7b5e; --green-soft: #e4efe6; --alert: #b0503a; --alert-soft: #fbece6;
  --offline: #5c6670; --offline-soft: #eceef0; --radius: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #c99a4a; outline-offset: 2px; }
a { color: var(--green); }
[hidden] { display: none !important; }

/* ---- Layout: three columns on a laptop screen, one column in a narrow window ------------------ */
.layout {
  height: 100vh; padding: 20px 24px 34px; gap: 16px;
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr) minmax(360px, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "alert alert assistant" "contact guidance assistant";
}
.alert-card { grid-area: alert; }
.assistant { grid-area: assistant; }
.contact { grid-area: contact; }
.guidance { grid-area: guidance; }
@media (max-width: 1040px) {
  .layout { height: auto; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto;
            grid-template-areas: "alert alert" "assistant assistant" "contact guidance"; }
  .assistant { height: 78vh; min-height: 480px; }
}
@media (max-width: 680px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "alert" "assistant" "contact" "guidance"; padding: 12px; }
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-height: 0; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
footer { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }

/* ---- Banner: internet lost / back --------------------------------------------------------------- */
.banner {
  position: fixed; top: 12px; left: 50%; z-index: 20; transform: translate(-50%, 0);
  display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-radius: 999px;
  background: #2c3439; color: #fff; box-shadow: 0 10px 30px #0003; font-size: 16px;
  animation: drop .35s ease-out;
}
.banner.back { background: var(--green); }
.banner svg { width: 22px; height: 22px; flex: none; }
@keyframes drop { from { transform: translate(-50%, -30px); opacity: 0; } }

/* ---- Alert card ---------------------------------------------------------------------------------- */
.alert-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 40%); gap: 18px; align-items: center;
              border-left: 8px solid var(--alert); transition: border-color .4s, background .4s; }
.alert-card.stale { border-left-color: var(--offline); background: #fbfbfa; }
.alert-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.alert-card .eyebrow { color: var(--alert); }
.alert-card.stale .eyebrow { color: var(--offline); }
.alert-card h1 { font-size: clamp(26px, 2.6vw, 36px); line-height: 1.15; letter-spacing: -.5px; margin: 8px 0 4px; }
.alert-summary { margin: 0 0 12px; color: var(--muted); }
.readings { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; }
.reading { background: var(--alert-soft); border-radius: 14px; padding: 8px 14px; min-width: 120px; transition: background .4s; }
.alert-card.stale .reading { background: var(--offline-soft); }
.reading dt { font-size: 12px; color: var(--muted); }
.reading dd { margin: 0; font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.reading .trend { font-size: 13px; font-weight: 600; color: var(--alert); margin-left: 6px; }
.reading.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: #f6c9b9; } }
.status-chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
               background: var(--green-soft); color: var(--green); font-variant-numeric: tabular-nums; }
.status-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.status-chip.live .dot { animation: pulse 2s infinite; }
.status-chip.updated .dot { animation: ping .8s ease-out; }
.status-chip.offline { background: var(--offline-soft); color: var(--offline); }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes ping { from { box-shadow: 0 0 0 0 #4f7b5e88; } to { box-shadow: 0 0 0 10px #4f7b5e00; } }
.scene-wrap { position: relative; border-radius: 16px; overflow: hidden; }
.scene-wrap iframe { display: block; width: 100%; aspect-ratio: 1412 / 1114; border: 0; background: transparent; transition: filter .6s; }
.alert-card.stale iframe { filter: grayscale(.75) brightness(.97); }
.scene-label { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap;
               background: #2c3439d9; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 999px; }

/* ---- Assistant ------------------------------------------------------------------------------------ */
.assistant { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.assistant-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.assistant-head h2 { margin: 0; font-size: 18px; }
.model { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
         background: var(--green-soft); color: var(--green); transition: background .4s, color .4s; }
.model::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.model.local { background: #f3ead9; color: #85612a; }
.thread { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 88%; padding: 12px 15px; border-radius: 18px; overflow-wrap: anywhere; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
.msg ol, .msg ul { margin: 4px 0 6px; padding-left: 22px; } .msg li { margin: 3px 0; }
.msg.user { align-self: flex-end; background: #dfeae2; border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: #f0f1ea; border-bottom-left-radius: 6px; }
.msg.note { align-self: center; max-width: 94%; background: #fff; border: 1.5px dashed #b9c0c4; color: var(--text); font-size: 15px; }
.msg.note.offline-note { border-color: var(--offline); background: var(--offline-soft); }
.msg.error { align-self: center; background: #fff3e0; font-size: 14px; }
.meta { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: #9aa3a6; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 30% { transform: translateY(-5px); opacity: .6; } }
.followups { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
.chip { border: 1px solid #cfd8cf; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.chip:hover { background: var(--green-soft); }
.chip:disabled { opacity: .5; cursor: default; }
.composer { border-top: 1px solid var(--line); padding: 12px 16px 14px; }
.prompts { display: grid; gap: 8px; margin-bottom: 10px; }
.prompts button { text-align: left; border: 1px solid #cfd8cf; background: #fff; border-radius: 14px; padding: 11px 14px; font-size: 15px; }
.prompts button:hover { background: var(--green-soft); }
.help { border: 0; background: var(--alert); color: #fff; font-weight: 650; border-radius: 999px; padding: 9px 18px; margin-bottom: 10px; }
.help[aria-expanded="true"] { background: #8e3f2d; }
form { flex: 1; display: flex; gap: 6px; align-items: center; padding: 5px; border: 1px solid #d6dbd2; border-radius: 999px; background: #fff; min-width: 0; }
form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 7px 10px; font-size: 16px; }
.round { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; }
.round svg { width: 20px; height: 20px; }
.send { background: var(--green); color: #fff; }
.send:disabled { background: #a9b7ad; cursor: default; }
.mic { background: var(--green-soft); color: var(--green); position: relative; }
.mic.recording { background: var(--alert); color: #fff; }
.mic.recording::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--alert);
                        opacity: .5; transform: scale(calc(1 + var(--level, 0) * 0.6)); transition: transform .08s; }
.mic.busy { opacity: .6; cursor: progress; }
.hint { margin: 8px 4px 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }

/* ---- Contact and official guidance ------------------------------------------------------------- */
.contact h2, .guidance h2 { font-size: 13px; margin: 0 0 10px; }
.contact-name { font-size: 22px; font-weight: 650; margin: 0; }
.contact-detail { color: var(--muted); margin: 0 0 4px; }
.contact-phone { font-size: 18px; font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.call { display: inline-block; text-decoration: none; background: var(--green); color: #fff; font-weight: 650; padding: 10px 18px; border-radius: 999px; }
.call-911 { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--alert-soft); color: #7d3424; font-weight: 600; font-size: 15px; }
.small { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.guidance { display: flex; flex-direction: column; }
.guidance h3 { margin: 0 0 6px; font-size: 18px; }
.steps { margin: 0; padding-left: 22px; overflow-y: auto; flex: 1; min-height: 0; }
.steps li { margin: 0 0 7px; }
.sources { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

/* ---- Launch alert ---------------------------------------------------------------------------------- */
.launch { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #1e262bcc; padding: 24px; animation: fade .3s; }
@keyframes fade { from { opacity: 0; } }
.launch-box { background: var(--panel); border-radius: 26px; padding: 30px 34px; max-width: 560px; width: 100%; border-top: 10px solid var(--alert);
              box-shadow: 0 30px 80px #0005; }
.launch-box .eyebrow { color: var(--alert); }
.launch-box h2 { font-size: 34px; line-height: 1.15; margin: 8px 0 10px; letter-spacing: -.5px; }
.launch-box p { margin: 0 0 16px; font-size: 17px; }
.launch-box .readings { margin-bottom: 22px; }
.launch-box button { width: 100%; border: 0; background: var(--alert); color: #fff; font-size: 18px; font-weight: 650; padding: 14px; border-radius: 16px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="banner" id="banner" role="status" aria-live="assertive" hidden>
  <svg id="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>
  <span><strong id="banner-title"></strong> <span id="banner-text"></span></span>
</div>

<main class="layout">
  <section class="panel alert-card" id="alert-card" aria-label="Current emergency">
    <div>
      <div class="alert-head">
        <span class="eyebrow" id="alert-name">Emergency</span>
        <span class="status-chip live" id="status-chip"><span class="dot"></span><span id="status-text">Connecting…</span></span>
      </div>
      <h1 id="alert-title">Checking for alerts…</h1>
      <p class="alert-summary" id="alert-summary"></p>
      <dl class="readings" id="readings"></dl>
    </div>
    <div class="scene-wrap">
      <iframe id="scene" src="/animation-studio?embed=external" title="Illustration of the current conditions"></iframe>
      <span class="scene-label" id="scene-label" hidden>Last update shown</span>
    </div>
  </section>

  <section class="panel assistant" aria-label="Your assistant">
    <header class="assistant-head">
      <h2>Your assistant</h2>
      <span class="model" id="model-badge">Online model</span>
    </header>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="composer">
      <div class="prompts" id="prompts" hidden></div>
      <button class="help" id="help-now" type="button" aria-expanded="false" aria-controls="prompts">Help me now</button>
      <form id="chat-form">
          <button class="round mic" id="mic" type="button" aria-label="Dictate a message" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </button>
          <input id="message" aria-label="Message to your assistant" placeholder="Type or dictate a message…" maxlength="2000" autocomplete="off">
          <button class="round send" id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
      </form>
      <p class="hint" id="hint" role="status"></p>
    </div>
  </section>

  <section class="panel contact" aria-label="Support contact">
    <h2 class="eyebrow">Your support contact</h2>
    <p class="contact-name" id="contact-name"></p>
    <p class="contact-detail" id="contact-detail"></p>
    <p class="contact-phone" id="contact-phone"></p>
    <a class="call" id="contact-call" href="#">Call</a>
    <p class="call-911">In danger right now? Call 911.</p>
    <p class="small">From your sign-up profile.</p>
  </section>

  <section class="panel guidance" aria-label="Official guidance">
    <h2 class="eyebrow">What officials say to do · saved on this laptop</h2>
    <h3 id="card-title"></h3>
    <ol class="steps" id="card-steps"></ol>
    <p class="sources" id="card-sources"></p>
  </section>
</main>

<footer>Demo scenario · not a real alert</footer>

<div class="launch" id="launch" role="dialog" aria-modal="true" aria-labelledby="launch-title" hidden>
  <div class="launch-box">
    <span class="eyebrow" id="launch-name">Emergency alert</span>
    <h2 id="launch-title"></h2>
    <p id="launch-text"></p>
    <dl class="readings" id="launch-readings"></dl>
    <button id="launch-ok" type="button">Got it</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---- State ----------------------------------------------------------------------------------------
  let setup = null;            // GET /api/setup
  let packet = null;           // the latest emergency packet received (kept while offline)
  let receivedAt = null;       // when it arrived (Date.now()), for "updated 4 s ago"
  let server = { internet: true, simulatedOffline: false, localReady: false }; // GET /api/status
  let offline = null;          // what the screen currently shows; null until the first check
  let launchShown = false;
  let busy = false;            // a question is being answered
  const history = [];          // {role, content}: what the model sees as the conversation

  // ---- Small helpers --------------------------------------------------------------------------------
  /** "just now", "12 s ago", "3 min ago" */
  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 5) return "just now";
    if (s < 60) return `${s} s ago`;
    return `${Math.floor(s / 60)} min ago`;
  }
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  async function getJson(url) {
    const response = await fetch(url, { cache: "no-store" });
    return { ok: response.ok, status: response.status, data: await response.json() };
  }
  async function postJson(url, body, timeoutMs = 120000) {
    const response = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      signal: AbortSignal.timeout(timeoutMs),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  // ---- Emergency readings ---------------------------------------------------------------------------
  // Which readings each scenario shows, how they're labelled, and how values are written.
  const SHOWN = {
    flood: ["riverLevel", "rainfall", "windGust"],
    fire: ["fireDistance", "pm25", "windGust"],
    earthquake: ["magnitude", "shakingIntensity"],
    outage: ["customersWithoutPower", "temperature"],
    heat: ["heatIndex", "temperature"],
  };
  const LABELS = {
    riverLevel: "Creek level", rainfall: "Rain, last hour", windGust: "Wind gusts", fireDistance: "Fire distance",
    pm25: "Smoke (PM2.5)", magnitude: "Magnitude", shakingIntensity: "Shaking intensity",
    customersWithoutPower: "Homes without power", temperature: "Temperature", heatIndex: "Feels like",
  };
  const UNITS = { m: " m", mm: " mm", "km/h": " km/h", degC: "°C", "ug/m3": " µg/m³", km: " km", ha: " ha", Mw: "", MMI: " of 12", "%": "%" };
  const RISING = new Set(["riverLevel", "rainfall", "pm25"]); // readings where "rising" is worth saying
  const SUMMARY = {
    flood: "Heavy rain and a rising creek near your home.",
    fire: "An active wildfire and heavy smoke in your area.",
    earthquake: "Strong shaking was detected near your home.",
    outage: "Most homes in your area have no power.",
    heat: "Dangerous heat in your area today.",
  };

  /** The observation one hour before the latest one, from the packet's own history (null if none). */
  function hourBefore(p, metric) {
    const observed = p.records.filter((r) => r.metric === metric && r.kind === "observation" && r.value !== null);
    return observed.length > 1 ? observed[observed.length - 2].value : null;
  }

  /**
   * Fills a <dl> with the scenario's readings. "↑ rising" = higher than an hour earlier. When `previous`
   * is given and a value changed since that packet, the box flashes once to show the update.
   */
  function renderReadings(target, current, previous) {
    target.replaceChildren();
    for (const metric of SHOWN[current.hazard] || []) {
      const now = current.latest.find((m) => m.metric === metric);
      if (!now || now.value === null) continue;
      const box = el("div", "reading");
      box.append(el("dt", "", LABELS[metric]));
      const value = el("dd", "", `${now.value}${UNITS[now.unit] ?? " " + now.unit}`);
      const earlier = hourBefore(current, metric);
      if (RISING.has(metric) && earlier !== null && now.value > earlier) value.append(el("span", "trend", "↑ rising"));
      const before = previous?.latest.find((m) => m.metric === metric)?.value;
      if (typeof before === "number" && before !== now.value) box.classList.add("flash");
      box.append(value);
      target.append(box);
    }
  }

  /** A new packet arrived from the feed: update the alert card and the animated window. */
  function showPacket(next) {
    const previous = packet;
    packet = next;
    receivedAt = Date.now();
    $("alert-title").textContent = next.stage.summary;
    $("alert-summary").textContent = SUMMARY[next.hazard] || "";
    renderReadings($("readings"), next, previous);
    sendScene();
    const chip = $("status-chip");
    chip.classList.remove("updated");
    void chip.offsetWidth; // restart the "ping" animation
    chip.classList.add("updated");
    if (!launchShown) showLaunch();
  }

  // The animated window is xethrus's animation studio page in an iframe; it listens for this message.
  // hours = 9 keeps it daytime (no clock). running = false freezes the animation while offline.
  function sendScene() {
    if (!packet || !sceneReady) return;
    $("scene").contentWindow.postMessage({ type: "weather-context", packet, running: !offline, hours: 9, replay: 0 }, location.origin);
  }
  let sceneReady = false;
  $("scene").addEventListener("load", () => { sceneReady = true; sendScene(); });

  // ---- Launch alert -----------------------------------------------------------------------------------
  function showLaunch() {
    launchShown = true;
    $("launch-name").textContent = setup?.alertName || "Emergency alert";
    $("launch-title").textContent = `${packet.stage.summary} near your home`;
    $("launch-text").textContent = "Your assistant is ready to help, and it keeps working even without internet.";
    renderReadings($("launch-readings"), packet, null);
    $("launch").hidden = false;
    $("launch-ok").focus();
  }
  function closeLaunch() {
    $("launch").hidden = true;
    $("message").focus();
  }
  $("launch-ok").onclick = closeLaunch;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("launch").hidden) closeLaunch(); });

  // ---- Online / offline -------------------------------------------------------------------------------
  const ICON_OFFLINE = '<path d="M2 8.8a15 15 0 014.2-2.6M9.3 5.3A15 15 0 0122 8.8M5 12.5a10 10 0 015.2-2.7M15 10.6a10 10 0 014 1.9M8.5 16.1a5 5 0 017 0M12 20h.01M3 3l18 18"/>';
  const ICON_ONLINE = '<path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16.1a5 5 0 017 0M12 20h.01"/>';
  let bannerTimer = null;

  function banner(kind) {
    clearTimeout(bannerTimer);
    const b = $("banner");
    if (kind === null) { b.hidden = true; return; }
    b.classList.toggle("back", kind === "back");
    $("banner-icon").innerHTML = kind === "back" ? ICON_ONLINE : ICON_OFFLINE;
    $("banner-title").textContent = kind === "back" ? "Back online." : "No internet.";
    $("banner-text").textContent = kind === "back" ? "Updates resumed." : "Your assistant still works on this laptop.";
    b.hidden = false;
    if (kind === "back") bannerTimer = setTimeout(() => (b.hidden = true), 6000);
  }

  /** The model badge in the assistant's header. */
  function showModel() {
    const local = offline || setup?.provider === "local";
    $("model-badge").classList.toggle("local", local);
    $("model-badge").textContent = local ? "On this laptop" : "Online model";
    $("hint").textContent = offline
      ? "Offline: answers come from this laptop."
      : setup?.provider === "local"
        ? "Answers come from this laptop."
        : "Answers come from the online model. If the internet drops, this laptop takes over.";
  }

  /** Works out whether we're offline and, when that changes, updates everything on screen. */
  function applyConnectivity() {
    const next = !navigator.onLine || !server.internet || server.simulatedOffline;
    if (next === offline) return;
    const first = offline === null;
    offline = next;
    $("alert-card").classList.toggle("stale", offline);
    $("scene-label").hidden = !offline;
    $("status-chip").classList.toggle("offline", offline);
    $("status-chip").classList.toggle("live", !offline);
    updateStatusText();
    showModel();
    sendScene();
    if (offline) {
      banner("offline");
      const name = (setup?.alertName || "emergency").toLowerCase();
      const age = receivedAt ? ago(Date.now() - receivedAt).replace("just now", "a moment ago") : null;
      note(first
        ? "This laptop has no internet right now. I can still help: my answers come from this laptop."
        : `We lost the internet. I'm still here, answering from this laptop. The ${name} information on screen is from ${age}, and it won't update until we're back online.`,
        true);
    } else if (!first) {
      banner("back");
      note("We're back online. Emergency updates have resumed.");
      refreshFeed();
    }
  }

  /** The text in the Live/Offline chip, refreshed every second. */
  function updateStatusText() {
    if (offline === null) return;
    const age = receivedAt ? ago(Date.now() - receivedAt) : null;
    if (offline) $("status-text").textContent = age ? `Offline · last update ${age}` : "Offline · no updates";
    else $("status-text").textContent = age ? `Live · updated ${age}` : "Live";
    $("scene-label").textContent = age ? `Last update ${age}` : "Last update shown";
  }

  async function refreshStatus() {
    try {
      const { data } = await getJson("/api/status");
      server = data;
    } catch {
      // The local server itself didn't answer (shouldn't happen inside the app); keep the last state.
    }
    applyConnectivity();
  }

  async function refreshFeed() {
    if (offline) {
      // First launch without internet: show what the app had saved, marked as offline.
      if (!packet) {
        try { const r = await getJson("/api/feed?saved=1"); if (r.ok) showPacket(r.data.packet); } catch {}
      }
      return;
    }
    try {
      const r = await getJson("/api/feed");
      if (r.ok) showPacket(r.data.packet);
      else await refreshStatus(); // 503: the server just noticed the internet is gone
    } catch {}
  }

  window.addEventListener("online", applyConnectivity);
  window.addEventListener("offline", applyConnectivity);

  // Hidden presenter key: Ctrl+Shift+O switches "simulate offline" on and off (no Wi-Fi needed).
  document.addEventListener("keydown", async (e) => {
    if (!(e.ctrlKey && e.shiftKey && e.code === "KeyO")) return;
    e.preventDefault();
    try {
      server = { ...server, ...(await postJson("/api/simulate-offline", { offline: !server.simulatedOffline })) };
    } catch {}
    applyConnectivity();
  });

  // ---- Conversation -----------------------------------------------------------------------------------
  const thread = $("thread");
  const scrollDown = () => (thread.scrollTop = thread.scrollHeight);

  /**
   * Turns an answer into paragraphs and numbered or bulleted lists, using text only (never innerHTML),
   * so nothing in an answer can inject markup. **bold** becomes <strong>.
   */
  function formatAnswer(text) {
    const out = document.createDocumentFragment();
    let list = null;
    const inline = (parent, line) => {
      line.split(/(\*\*[^*]+\*\*)/).forEach((part) => {
        if (/^\*\*[^*]+\*\*$/.test(part)) parent.append(el("strong", "", part.slice(2, -2)));
        else if (part) parent.append(document.createTextNode(part));
      });
    };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
      const bullet = line.match(/^[-*•]\s+(.*)$/);
      if (numbered || bullet) {
        const tag = numbered ? "ol" : "ul";
        if (!list || list.tagName.toLowerCase() !== tag) {
          list = el(tag);
          if (numbered) list.start = Number(numbered[1]);
          out.append(list);
        }
        const item = el("li");
        inline(item, numbered ? numbered[2] : bullet[1]);
        list.append(item);
      } else if (line) {
        list = null;
        const p = el("p");
        inline(p, line);
        out.append(p);
      }
    }
    return out;
  }

  function removeFollowups() { thread.querySelectorAll(".followups").forEach((n) => n.remove()); }

  function addUser(text) {
    removeFollowups();
    thread.append(el("div", "msg user", text));
    scrollDown();
  }

  /** An assistant answer, with a small line saying where it came from, and the follow-up chips. */
  function addAnswer(text, meta) {
    const box = el("div", "msg assistant");
    box.append(formatAnswer(text));
    if (meta) box.append(el("span", "meta", meta));
    thread.append(box);
    const chips = el("div", "followups");
    for (const [label, message] of [
      ["Done", "I did that. What should I do next?"],
      ["I can't do that", "I can't do that. Help me find an option I can manage."],
      ["Explain more", "Please explain that more simply."],
    ]) {
      const chip = el("button", "chip", label);
      chip.type = "button";
      chip.onclick = () => send(message);
      chips.append(chip);
    }
    thread.append(chips);
    scrollDown();
  }

  /** A short message from the app itself (offline, back online, welcome). Not sent to the model. */
  function note(text, isOffline = false) {
    thread.append(el("div", `msg note${isOffline ? " offline-note" : ""}`, text));
    scrollDown();
  }

  function addError(text) {
    thread.append(el("div", "msg error", text));
    scrollDown();
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    $("send").disabled = true;
    thread.querySelectorAll(".chip").forEach((c) => (c.disabled = true));
    hidePrompts();
    addUser(text);
    $("message").value = "";
    const typing = el("div", "msg assistant typing");
    typing.append(el("span"), el("span"), el("span"));
    typing.setAttribute("aria-label", "Assistant is answering");
    thread.append(typing);
    scrollDown();
    try {
      const result = await postJson("/api/chat", {
        text, mode: offline ? "local" : "connected", context: packet, history: history.slice(-12),
      });
      typing.remove();
      const meta = result.fallback
        ? "Answered on this laptop: the online model couldn't be reached."
        : result.provider === "local" ? "Answered on this laptop." : "Answered by the online model.";
      addAnswer(result.answer, meta);
      history.push({ role: "user", content: text }, { role: "assistant", content: result.answer });
    } catch (error) {
      typing.remove();
      addError(error.name === "TimeoutError" ? "That took too long. Please try again." : error.message);
    } finally {
      busy = false;
      $("send").disabled = false;
    }
  }

  $("chat-form").onsubmit = (e) => { e.preventDefault(); send($("message").value); };

  // ---- Help me now ------------------------------------------------------------------------------------
  function hidePrompts() { $("prompts").hidden = true; $("help-now").setAttribute("aria-expanded", "false"); }
  $("help-now").onclick = () => {
    const open = $("prompts").hidden;
    $("prompts").hidden = !open;
    $("help-now").setAttribute("aria-expanded", String(open));
    if (open) $("prompts").querySelector("button")?.focus();
  };

  // ---- Dictation --------------------------------------------------------------------------------------
  // Records the microphone at 16,000 samples per second (what Whisper expects), then sends the raw
  // samples to /api/transcribe, which runs Whisper on this laptop. The words go into the message box so
  // the person can check them before sending.
  const MAX_SECONDS = 30;
  let recording = null; // { stream, context, processor, chunks, timer }

  async function startRecording() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    } catch {
      $("hint").textContent = "The microphone isn't available. Allow it in System Settings > Privacy & Security > Microphone, or type instead.";
      return;
    }
    const context = new AudioContext({ sampleRate: 16000 });
    const source = context.createMediaStreamSource(stream);
    // ScriptProcessor hands us the samples in blocks. (Deprecated in favour of AudioWorklet, but simple
    // and still supported; the output is left silent.)
    const processor = context.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    processor.onaudioprocess = (e) => {
      const samples = new Float32Array(e.inputBuffer.getChannelData(0));
      chunks.push(samples);
      let sum = 0;
      for (const s of samples) sum += s * s;
      $("mic").style.setProperty("--level", Math.min(1, Math.sqrt(sum / samples.length) * 8).toFixed(2));
    };
    source.connect(processor);
    processor.connect(context.destination);
    recording = { stream, context, processor, chunks, timer: setTimeout(stopRecording, MAX_SECONDS * 1000) };
    $("mic").classList.add("recording");
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").setAttribute("aria-label", "Stop dictating");
    $("hint").textContent = "Listening… tap the microphone again when you're done.";
  }

  async function stopRecording() {
    if (!recording) return;
    const { stream, context, processor, chunks, timer } = recording;
    recording = null;
    clearTimeout(timer);
    processor.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    await context.close();
    const mic = $("mic");
    mic.classList.remove("recording");
    mic.setAttribute("aria-pressed", "false");
    mic.setAttribute("aria-label", "Dictate a message");
    const length = chunks.reduce((n, c) => n + c.length, 0);
    if (length < 16000 * 0.4) { $("hint").textContent = "That was too short. Tap the microphone and speak."; return; }
    const audio = new Float32Array(length);
    let offset = 0;
    for (const c of chunks) { audio.set(c, offset); offset += c.length; }
    mic.classList.add("busy");
    mic.disabled = true;
    $("hint").textContent = "Writing down what you said…";
    try {
      const response = await fetch("/api/transcribe", {
        method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: audio.buffer,
        signal: AbortSignal.timeout(90000),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      if (!data.text) { $("hint").textContent = "I didn't catch any words. Please try again."; return; }
      const box = $("message");
      box.value = `${box.value} ${data.text}`.trim().slice(0, 2000);
      box.focus();
      $("hint").textContent = "Check the words, then press send.";
    } catch {
      $("hint").textContent = "Dictation didn't work this time. Please type instead.";
    } finally {
      mic.classList.remove("busy");
      mic.disabled = false;
    }
  }

  $("mic").onclick = () => (recording ? stopRecording() : startRecording());

  // ---- Start ------------------------------------------------------------------------------------------
  async function start() {
    const { data } = await getJson("/api/setup");
    setup = data;
    $("alert-name").textContent = setup.alertName;
    // Support contact (read-only, from the profile). The phone link opens the Mac's calling app.
    $("contact-name").textContent = setup.contact.name;
    $("contact-detail").textContent = `Your ${setup.contact.relation} · ${setup.contact.city}`;
    $("contact-phone").textContent = setup.contact.phone;
    $("contact-call").textContent = `Call ${setup.contact.name}`;
    $("contact-call").href = `tel:${setup.contact.phone.replace(/[^+0-9]/g, "")}`;
    // Official card.
    if (setup.card) {
      $("card-title").textContent = setup.card.title;
      $("card-steps").replaceChildren(...setup.card.steps.map((s) => el("li", "", s)));
      $("card-sources").replaceChildren(document.createTextNode("Source: "));
      setup.card.sources.forEach((s, i) => {
        if (i) $("card-sources").append(document.createTextNode(", "));
        const a = el("a", "", s.name);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        $("card-sources").append(a);
      });
      $("card-sources").append(document.createTextNode(" (opening the page needs internet)"));
    }
    // "Help me now" prompts.
    $("prompts").replaceChildren(...setup.prompts.map((p) => {
      const b = el("button", "", p);
      b.type = "button";
      b.onclick = () => send(p);
      return b;
    }));
    note(`I'm here to help with the ${setup.alertName.toLowerCase()}. Ask me anything, or tap Help me now.`);
    await refreshStatus();
    await refreshFeed();
    setInterval(refreshStatus, 1000);
    setInterval(refreshFeed, 10000);
    setInterval(updateStatusText, 1000);
  }
  start();
})();
</script>
</body>
</html>
