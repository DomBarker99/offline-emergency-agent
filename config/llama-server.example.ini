; Example preset for llama.cpp's llama-server in router mode:
;   llama-server --models-preset config/llama-server.example.ini --models-max 1
; Section names must match the "local" IDs in config/models.json.
; Set each "model" path to where you downloaded the GGUF file.
version = 1

[*]
c = 8192
jinja = true

[gemma4-26b-a4b]
; https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf
model = /path/to/models/gemma-4-26B-A4B-it-qat-q4_0.gguf
chat-template-kwargs = {"enable_thinking": false}

[gpt-oss-20b]
; https://huggingface.co/ggml-org/gpt-oss-20b-GGUF  (always reasons; only effort is adjustable)
model = /path/to/models/gpt-oss-20b-MXFP4.gguf
chat-template-kwargs = {"reasoning_effort": "low"}

[granite4.2-8b]
; https://huggingface.co/ibm-granite/granite-4.2-8b-GGUF
model = /path/to/models/granite-4.2-8b-Q4_K_M.gguf
chat-template-kwargs = {"enable_thinking": false}
